[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# UUPS proxies need the deployed bytecode of the implementation available to the
# upgrade-safety checks and to the deploy script
extra_output = ["storageLayout"]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
localhost = "http://127.0.0.1:8545"

# No [etherscan] section: foundry resolves it eagerly, so declaring keys here
# makes every local script fail when ETHERSCAN_API_KEY is unset. Pass the key at
# verify time instead:
#   forge script ... --verify --etherscan-api-key "$ETHERSCAN_API_KEY"
